name: CI

on:
  push:
    branches:
      - main
      - fullstack-refactor
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'StreamKeepr.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Restore
        run: dotnet restore StreamKeepr.sln

      - name: Build with warnings as errors
        run: dotnet build StreamKeepr.sln --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format StreamKeepr.sln --verify-no-changes --no-restore

      - name: Test with coverage
        run: >
          dotnet test StreamKeepr.sln
          --no-build
          --filter "Category!=E2E"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          --logger trx

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  js:
    name: JS lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: tests/js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag streamkeepr:ci .

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail

          image="streamkeepr:ci"
          container="streamkeepr-ci-${GITHUB_RUN_ID:-local}"
          volume="${container}-recordings"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm --force "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume" >/dev/null
          docker run --detach --name "$container" \
            --publish 18080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env Storage__RecordingsRoot=/recordings \
            --env Twitch__ClientId=dummy-client-id \
            --env Twitch__ClientSecret=dummy-client-secret \
            --mount "type=volume,source=$volume,target=/recordings" \
            "$image"

          healthy=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health/live >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::/health/live did not become healthy after $attempt attempts"
            docker logs "$container"
            exit 1
          fi

          status=$(curl --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/)
          if [ "$status" -ne 200 ]; then
            echo "::error::/ returned HTTP $status, expected 200"
            docker logs "$container"
            exit 1
          fi

          uid=$(docker exec "$container" id -u)
          if [ "$uid" -ne 1654 ]; then
            echo "::error::container runs as UID $uid, expected 1654"
            exit 1
          fi

          recordings_uid=$(docker exec "$container" stat -c '%u' /recordings)
          if [ "$recordings_uid" -ne 1654 ]; then
            echo "::error::/recordings is owned by UID $recordings_uid, expected 1654"
            exit 1
          fi

          docker exec "$container" curl --fail --silent --show-error \
            http://localhost:8080/health/live >/dev/null

          streamlink_version=$(docker exec "$container" streamlink --version)
          if [[ "$streamlink_version" != *"8.6.3"* ]]; then
            echo "::error::Streamlink version is '$streamlink_version', expected 8.6.3"
            exit 1
          fi

          ffmpeg_version=$(docker exec "$container" ffmpeg -version)
          if [[ "$ffmpeg_version" != *"9.0.2"* ]]; then
            echo "::error::FFmpeg version is '${ffmpeg_version%%$'\n'*}', expected 9.0.2"
            exit 1
          fi

          if docker exec "$container" test -d /app/tests \
            || docker exec "$container" test -d /app/docs; then
            echo "::error::image contains test/docs assets"
            exit 1
          fi

          healthcheck=$(docker inspect --format '{{json .Config.Healthcheck}}' "$container")
          echo "Healthcheck: $healthcheck"
          if [[ "$healthcheck" != *"/health/live"* ]]; then
            echo "::error::image healthcheck does not probe /health/live"
            exit 1
          fi

          echo "Container UID: $uid; /recordings UID: $recordings_uid"

          docker stop --time 50 "$container" >/dev/null
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container")
          echo "Container exit code after stop: $exit_code"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::container did not stop cleanly (exit $exit_code)"
            docker logs "$container"
            exit 1
          fi

          docker logs --tail 20 "$container"

  e2e:
    name: E2E (Mock profile)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'StreamKeepr.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/StreamKeepr.E2E/StreamKeepr.E2E.csproj') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Restore
        run: dotnet restore StreamKeepr.sln

      - name: Build with warnings as errors
        run: dotnet build StreamKeepr.sln --no-restore -warnaserror

      - name: Install branded Chrome and Playwright dependencies
        run: >
          pwsh tests/StreamKeepr.E2E/bin/Debug/net10.0/playwright.ps1
          install --with-deps chrome

      - name: Run E2E tests
        env:
          STREAMKEEPR_E2E_ARTIFACTS: ${{ runner.temp }}/streamkeepr-e2e
        run: >
          dotnet test tests/StreamKeepr.E2E/StreamKeepr.E2E.csproj
          --no-build
          --results-directory ${{ runner.temp }}/streamkeepr-e2e/trx
          --logger trx

      - name: Upload Playwright report, traces, and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ${{ runner.temp }}/streamkeepr-e2e
          if-no-files-found: error

      - name: Upload E2E test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: ${{ runner.temp }}/streamkeepr-e2e/trx/**/*.trx
          if-no-files-found: warn

  compose:
    name: Compose deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and smoke-test Compose
        run: ./scripts/compose-smoke.sh
