<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .cover { position: relative; width: 960px; height: 288px; background: var(--background); overflow: hidden; font-family: var(--font-sans); }
  svg { position: absolute; left: 0; top: 0; }
  .primary { fill: var(--primary); }
  .secondary { fill: var(--secondary); }
  .tertiary { fill: var(--tertiary); }
  .raised { fill: var(--surface-raised); }
  .rec { fill: var(--rec); }
  .seg { fill: var(--primary-contrast-text); }
  .text { position: absolute; left: 48px; bottom: 48px; max-width: 440px; }
  .name { margin: 0; font-size: 64px; line-height: 0.95; font-weight: 700; color: var(--text-primary); letter-spacing: 0; }
  .tag { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: primary 264×204 slab (bleeds off the top), secondary 144×112, tertiary 144×128, surface-raised 264×48 track band with a 4×16 tertiary chapter tick, rec disc r=12 (state colour, kept small)
      arrangement: one tall magenta slab with cyan and indigo satellites stacked on its right, all right of x=480, gaps space-6 (24)
      pattern: "a literal motif" row: HLS segments as pills cut from radius-full, 8px tall at a space-3 (12px) pitch, like a capture being written; the REC disc marks the live edge
      steps and radii: space-3 12, space-6 24; radius-lg 12 on blocks; pills rx 4 (half of 8)
    -->
    <rect class="primary" x="504" y="-12" width="264" height="204" rx="12"/>
    <rect class="secondary" x="792" y="24" width="144" height="112" rx="12"/>
    <rect class="tertiary" x="792" y="160" width="144" height="128" rx="12"/>
    <rect class="raised" x="504" y="216" width="264" height="48" rx="12"/>
    <rect class="seg" x="528" y="108" width="44" height="8" rx="4"/><rect class="seg" x="576" y="108" width="36" height="8" rx="4"/><rect class="seg" x="616" y="108" width="52" height="8" rx="4"/><rect class="seg" x="672" y="108" width="40" height="8" rx="4"/>
    <rect class="seg" x="528" y="132" width="36" height="8" rx="4"/><rect class="seg" x="568" y="132" width="48" height="8" rx="4"/><rect class="seg" x="620" y="132" width="40" height="8" rx="4"/><rect class="seg" x="664" y="132" width="44" height="8" rx="4"/><rect class="seg" x="712" y="132" width="32" height="8" rx="4"/>
    <rect class="seg" x="528" y="156" width="52" height="8" rx="4"/><rect class="seg" x="584" y="156" width="40" height="8" rx="4"/><rect class="seg" x="628" y="156" width="36" height="8" rx="4"/>
    <circle class="rec" cx="680" cy="160" r="12"/>
    <!-- seek track in the lower band: played range in primary, a chapter tick in tertiary, the live edge in rec -->
    <rect class="primary" x="528" y="236" width="168" height="8" rx="4"/>
    <rect class="tertiary" x="600" y="232" width="4" height="16" rx="2"/>
    <circle class="rec" cx="720" cy="240" r="6"/>
    <!-- segments continuing on the cyan and indigo blocks -->
    <rect class="seg" x="816" y="88" width="40" height="8" rx="4"/><rect class="seg" x="860" y="88" width="52" height="8" rx="4"/>
    <rect class="seg" x="816" y="232" width="56" height="8" rx="4"/><rect class="seg" x="876" y="232" width="36" height="8" rx="4"/>
    <rect class="seg" x="816" y="256" width="40" height="8" rx="4"/>
  </svg>
  <div class="text">
    <h1 class="name">StreamKeepr</h1>
    <p class="tag">A personal DVR for Twitch. The video is the product.</p>
  </div>
</div>
</body>
</html>
