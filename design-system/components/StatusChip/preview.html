<!-- @dsCard group="Status" height=200 width=880 subtitle="Six kinds; the word carries the meaning and colour is the second cue" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .ground { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); }
  .g1 { background: var(--drawer-background); border: 1px solid var(--divider); }
  .g2 { background: var(--surface); border: 1px solid var(--lines-default); }
  .k { font: var(--text-caption); color: var(--text-secondary); width: 130px; }
</style>
</head>
<body class="ds">
<div class="wrap">
  <div class="ground g1"><span class="k">On the drawer</span><span class="ds-status rec">Rec</span><span class="ds-status partial"><i data-i="sync"></i>Reconnecting</span><span class="ds-status processing"><i data-i="hourglass"></i>Processing</span><span class="ds-status partial"><i data-i="warning"></i>Partial</span><span class="ds-status saved"><i data-i="check"></i>Saved</span><span class="ds-status error"><i data-i="warning"></i>Error</span></div>
  <div class="ground g2"><span class="k">On a panel</span><span class="ds-status success"><i data-i="checkcircle"></i>Healthy</span><span class="ds-status saved">Push</span><span class="ds-status partial"><i data-i="schedule"></i>Polling</span><span class="ds-status saved"><i data-i="pause"></i>Paused</span><span class="ds-status error"><i data-i="warning"></i>Twitch session expired</span></div>
</div>
<script src="../icons.js"></script>
</body>
</html>
