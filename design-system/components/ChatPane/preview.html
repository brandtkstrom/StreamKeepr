<!-- @dsCard group="Playback" height=520 width=480 subtitle="Chat island, open. The player's Chat button and C open and close it; Chat sync is set in Settings" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); display: flex; gap: var(--space-4); align-items: stretch; height: 480px; }
  .c1 { color: var(--channel-4); } .c2 { color: var(--channel-2); } .c3 { color: var(--channel-1); } .c4 { color: var(--channel-3); }
  .live { display: inline-flex; align-items: center; font: var(--text-caption); color: var(--text-secondary); margin-left: auto; }
  .jump { align-self: center; margin-bottom: var(--space-2); border-radius: var(--radius-full); }
</style>
</head>
<body class="ds">
<div class="wrap">
  <aside class="ds-chat" aria-label="Chat replay">
    <header class="ds-chat-head ds-ihead"><i data-i="chat"></i><span class="t">Chat replay</span><span class="live" role="status" title="Chat replay"><i data-i="history" class="sm" aria-hidden="true"></i><span class="ds-sr">Chat replay</span></span></header>
    <div class="ds-chat-log" role="log" aria-label="Chat replay">
      <div><span class="ts">54:31</span><span class="n c1">sablefinch</span><span class="ds-muted">:</span> that reset was clean</div>
      <div><span class="ts">54:33</span><span class="n c2">mothlight</span><span class="ds-muted">:</span> any% or glitchless tonight?</div>
      <div><span class="reply">Replying to mothlight: any% or glitchless tonight?</span><span class="ts">54:36</span><span class="n c3">nightjar_tv</span><span class="ds-muted">:</span> any% until the 9pm block</div>
      <div><span class="ts">54:38</span><span class="n c4">quietkoi</span><span class="ds-muted">:</span> <i>waves from the back row</i></div>
      <div><span class="ts">54:40</span><span class="n c1">sablefinch</span><span class="ds-muted">:</span> PB pace on chapter 3</div>
    </div>
    <button class="ds-btn outlined sm jump">Jump to current time</button>
  </aside>
</div>
<script src="../icons.js"></script>
</body>
</html>
