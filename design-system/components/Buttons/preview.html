<!-- @dsCard group="Actions" height=430 width=900 subtitle="MudButton, MudIconButton, MudToggleIconButton, MudChipSet, MudSwitch, MudMenu" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); display: grid; grid-template-columns: 150px 1fr; gap: var(--space-4) var(--space-4); align-items: center; }
  .k { font: var(--text-caption); color: var(--text-secondary); }
  .menu-demo { display: flex; gap: var(--space-4); align-items: flex-start; }
</style>
</head>
<body class="ds">
<div class="wrap">
  <span class="k">Filled · the main action</span>
  <div class="ds-row-flex"><button class="ds-btn filled"><i data-i="output"></i>Export MP4</button><button class="ds-btn filled">Add</button><button class="ds-btn filled error">Delete</button><button class="ds-btn filled" disabled>Export MP4</button></div>

  <span class="k">Outlined · secondary</span>
  <div class="ds-row-flex"><button class="ds-btn outlined"><i data-i="playlist"></i>Copy playlist URL</button><button class="ds-btn outlined">Disconnect</button><button class="ds-btn outlined error"><i data-i="stop"></i>Stop recording</button><button class="ds-btn outlined" disabled>Copy playlist URL</button></div>

  <span class="k">Text · low emphasis</span>
  <div class="ds-row-flex"><button class="ds-btn text">Retry</button><button class="ds-btn text default">Cancel</button><button class="ds-btn text default">Resume recording</button><button class="ds-btn text default">Remove</button><button class="ds-btn text"><i data-i="copy"></i>Copy stats</button></div>

  <span class="k">Icon buttons</span>
  <div class="ds-row-flex"><button class="ds-ibtn" aria-label="Menu"><i data-i="menu"></i></button><button class="ds-ibtn" aria-label="Settings"><i data-i="settings"></i></button><button class="ds-ibtn on" aria-label="Statistics" aria-pressed="true"><i data-i="stats"></i></button><button class="ds-ibtn" aria-label="Delete recording"><i data-i="delete"></i></button><button class="ds-ibtn" aria-label="Delete recording" disabled><i data-i="delete"></i></button><span class="ds-tip">Connect Twitch to use this</span></div>

  <span class="k">Filter chips · switch</span>
  <div class="ds-row-flex"><div class="ds-chips"><button class="ds-chip sel"><i data-i="check"></i>All</button><button class="ds-chip"><i data-i="dot" style="color:var(--rec)"></i>Recording</button><button class="ds-chip"><i data-i="inventory"></i>Saved</button></div><span style="width:24px"></span><span class="ds-switch on" aria-hidden="true"></span><span>Auto-record</span><span class="ds-switch" aria-hidden="true"></span><span class="ds-muted">Notifications</span></div>

  <span class="k">Menu</span>
  <div class="menu-demo">
    <div class="ds-menu" role="menu" aria-label="Sort library">
      <div class="ds-menu-item" role="menuitemradio" aria-checked="true"><i data-i="check"></i>Newest first</div>
      <div class="ds-menu-item" role="menuitemradio" aria-checked="false"><i></i>Oldest first</div>
      <div class="ds-menu-item" role="menuitemradio" aria-checked="false"><i></i>A–Z by channel</div>
    </div>
    <div class="ds-menu" role="menu" aria-label="Channel actions">
      <div class="ds-menu-item" role="menuitem"><i data-i="stop"></i>Stop recording</div>
      <div class="ds-menu-item" role="menuitem"><i data-i="pause"></i>Pause</div>
      <div class="ds-menu-item" role="menuitem"><i data-i="delete"></i>Remove</div>
    </div>
  </div>
</div>
<script src="../icons.js"></script>
</body>
</html>
