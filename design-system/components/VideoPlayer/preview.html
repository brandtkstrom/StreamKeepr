<!-- @dsCard group="Playback" height=880 width=1000 subtitle="Player island: watching a live capture with the speed menu open, plus waiting and error states" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .small { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
  .menu { position: absolute; right: 150px; bottom: 60px; background: var(--player-surface); color: var(--player-text); }
  .menu .ds-menu-item .ds-i { color: var(--player-accent); }
  .menu .ds-menu-item { min-height: 36px; }
  .state { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: var(--space-3); text-align: center; padding: var(--space-6); }
  .state p { margin: 0; font: var(--text-body2); color: var(--player-text); }
  .state .err { color: var(--error); }
  .state .ds-btn.filled { background: var(--player-accent); color: var(--primary-contrast-text); }
  .state .ds-btn.text { color: var(--player-text); }
  .cap { font: var(--text-caption); color: var(--text-secondary); margin: 0 0 var(--space-1); }
</style>
</head>
<body class="ds">
<div class="wrap">
  <div class="ds-player" role="region" aria-label="Video player">
    <svg class="frame" viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="90" fill="#16161b"/><circle cx="122" cy="22" r="9" fill="#34343e"/><path d="M0 66 L28 48 L52 60 L84 38 L118 58 L160 44 L160 90 L0 90 Z" fill="#1f1f26"/><path d="M0 76 L40 64 L76 72 L112 62 L160 70 L160 90 L0 90 Z" fill="#292931"/><rect x="62" y="56" width="10" height="12" fill="#3d3d48"/></svg>
    <div class="ds-player-top"><div><b>Late-night speedrun practice: any% resets</b><span>nightjar_tv</span><span class="chapter"><i data-i="toc"></i>Boss rush</span></div><span class="ds-grow"></span><span class="ds-status rec">Rec</span></div>
    <div class="ds-menu menu" role="menu" aria-label="Playback speed">
      <div class="ds-menu-item" role="menuitemradio" aria-checked="false"><i></i>0.5×</div>
      <div class="ds-menu-item" role="menuitemradio" aria-checked="true"><i data-i="check"></i>Normal</div>
      <div class="ds-menu-item" role="menuitemradio" aria-checked="false"><i></i>1.25×</div>
      <div class="ds-menu-item" role="menuitemradio" aria-checked="false"><i></i>1.5×</div>
      <div class="ds-menu-item" role="menuitemradio" aria-checked="false"><i></i>2×</div>
    </div>
    <div class="ds-player-bottom">
      <div class="ds-seek" role="slider" aria-label="Seek" aria-valuetext="54:40 of 1:02:13"><div class="track"><div class="buf" style="width:96%"></div><div class="played" style="width:88%"></div></div><span class="tick" style="left:22%"></span><span class="tick" style="left:61%"></span><span class="knob" style="left:88%"></span><span class="edge" style="left:96%"></span></div>
      <div class="ds-controls">
        <button class="ds-pbtn" aria-label="Pause"><i data-i="pause"></i></button>
        <button class="ds-pbtn" aria-label="Back 10 seconds"><i data-i="replay"></i></button>
        <button class="ds-pbtn" aria-label="Forward 10 seconds"><i data-i="forward"></i></button>
        <span class="ds-vol"><button class="ds-pbtn" aria-label="Mute"><i data-i="volume"></i></button><span class="bar"><i></i></span></span>
        <span class="ds-ptime">54:40 <span class="dim">/ 1:02:13</span></span>
        <button class="ds-golive">Jump to live</button>
        <span class="ds-grow"></span>
        <button class="ds-pill" aria-expanded="true">1×</button>
        <button class="ds-pbtn" aria-label="Statistics" aria-pressed="false"><i data-i="stats"></i></button>
        <button class="ds-pbtn" aria-label="Picture in picture"><i data-i="pip"></i></button>
        <button class="ds-pbtn" aria-label="Theater mode" aria-pressed="false"><i data-i="theater"></i></button>
        <button class="ds-pbtn" aria-label="Full screen"><i data-i="fullscreen"></i></button>
      </div>
    </div>
  </div>
  <div class="small">
    <div>
      <p class="cap">Live capture, before the first segment</p>
      <div class="ds-player"><div class="state"><span class="ds-spin" aria-hidden="true"></span><p role="status">Waiting for the first segment…</p></div></div>
    </div>
    <div>
      <p class="cap">Playback failed</p>
      <div class="ds-player"><div class="state" role="alert"><i data-i="error" class="err" style="width:40px;height:40px"></i><p>This recording's playlist could not be loaded.</p><div class="ds-row-flex" style="justify-content:center"><button class="ds-btn filled">Retry</button><a class="ds-btn text" href="#">Back to library</a></div></div></div>
    </div>
  </div>
</div>
<script src="../icons.js"></script>
</body>
</html>
