<!-- @dsCard group="Playback" height=330 width=1000 subtitle="MudExpansionPanel: title, actions, meta, an export in progress and chapters" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); }
  .title-line { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
  .title-line h3 { margin: 0; font: var(--text-h5); flex: 1; min-width: 260px; }
  .dmeta { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; font: var(--text-caption); color: var(--text-secondary); margin-top: var(--space-2); }
  .dmeta .who { display: inline-flex; gap: var(--space-2); align-items: center; color: var(--text-primary); font: var(--text-body2); }
  .sep { width: 3px; height: 3px; border-radius: var(--radius-full); background: var(--text-secondary); }
  .export { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-raised); }
  .export .ds-progress { flex: 1; --c: var(--secondary); max-width: 320px; }
  .export .pct { font: var(--text-timecode); color: var(--text-secondary); }
  .ds-chapters { margin-top: var(--space-4); }
</style>
</head>
<body class="ds">
<div class="wrap">
  <section class="ds-panel">
    <div class="ds-panel-head ds-ihead" aria-expanded="true" role="button"><i data-i="info"></i><h2>Recording details</h2><span class="ds-cap">Yesterday, 20:30</span><i data-i="expand" class="ds-chev"></i></div>
    <div class="ds-panel-body">
      <div class="ds-vinfo flush">
          <h3 class="vtitle">Route planning with chat</h3>
          <div class="vrow"><div class="ds-meta"><span class="who"><span class="ds-avatar a1" style="width:24px;height:24px">N</span>nightjar_tv</span><span><i data-i="sportsesports"></i>Speedrunning</span><span><i data-i="event"></i>Yesterday, 20:30</span><span><i data-i="timer"></i>2h 14m</span><span><i data-i="folder"></i>806 segments · 1 part</span><span><i data-i="storage"></i>9.8 GB</span></div><div class="acts"><button class="ds-btn outlined"><i data-i="playlist"></i>Copy playlist URL</button> <button class="ds-btn filled disabled" disabled><i data-i="output"></i>Export MP4</button> <button class="ds-ibtn" aria-label="Delete recording"><i data-i="delete"></i></button></div></div>
        </div>
      <div class="export" data-export-row="Running">
        <i data-i="output" class="sm" style="color:var(--secondary)"></i>
        <span role="status">Exporting MP4</span>
        <div class="ds-progress" role="progressbar" aria-valuenow="42"><i style="width:42%"></i></div>
        <span class="pct">42%</span>
        <span class="ds-grow"></span>
        <button class="ds-btn text default sm">Cancel</button>
      </div>
      <div class="ds-chapters" role="group" aria-label="Chapters">
        <button class="ds-chapter"><span class="time">0:00:00</span><span class="title">Just chatting</span><span class="game">Just Chatting</span></button>
        <button class="ds-chapter cur"><span class="time">0:21:40</span><span class="title">Route planning</span><span class="game">Celeste</span></button>
        <button class="ds-chapter"><span class="time">1:34:05</span><span class="title">Full runs</span><span class="game">Celeste</span></button>
        <button class="ds-chapter"><span class="time">2:02:51</span><span class="title">Wind down</span><span class="game">Just Chatting</span></button>
      </div>
    </div>
  </section>
</div>
<script src="../icons.js"></script>
</body>
</html>
