<!-- @dsCard group="Playback" height=300 width=1000 subtitle="The title block under the player: title and meta on the left, actions stacked on the right, an export in progress below" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
</style>
</head>
<body class="ds">
<div class="wrap">
  <div class="ds-vhead">
    <div class="ds-vinfo">
      <h2 class="vtitle">Route planning with chat, then full runs until the 9pm block</h2>
      <div class="ds-meta"><span class="who"><span class="ds-avatar a1" style="width:24px;height:24px"><img src="../sample-avatars/nightjar_tv.svg" alt=""></span>nightjar_tv</span><span><i data-i="sportsesports"></i>Speedrunning</span><span><i data-i="event"></i>Yesterday, 20:30</span><span><i data-i="timer"></i>2h 14m</span><span><i data-i="folder"></i>806 segments · 1 part</span><span><i data-i="storage"></i>9.8 GB</span></div>
    </div>
    <div class="ds-vstack" role="group" aria-label="Recording actions">
      <button class="ds-btn outlined"><i data-i="playlist"></i>Copy playlist URL</button>
      <button class="ds-btn filled disabled" disabled><i data-i="output"></i>Export MP4</button>
      <button class="ds-btn text default"><i data-i="delete"></i>Delete recording</button>
    </div>
  </div>
  <div class="ds-export" data-export-row="Running">
    <i data-i="output" class="sm" style="color:var(--secondary)"></i>
    <span role="status">Exporting MP4</span>
    <div class="ds-progress" role="progressbar" aria-label="Export progress" aria-valuenow="42"><i style="width:42%"></i></div>
    <span class="pct">42%</span>
    <span class="ds-grow"></span>
    <button class="ds-btn text default sm">Cancel</button>
  </div>
</div>
<script src="../icons.js"></script>
</body>
</html>
