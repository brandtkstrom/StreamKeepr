<!-- @dsCard group="Settings" height=470 width=900 subtitle="Settings › Channels: MudPaper + MudList rows, add field" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { padding: var(--space-4); }
  h2 { margin: 0; padding: var(--space-4) var(--space-4) var(--space-2); font: var(--text-h6); }
  .busy { font: var(--text-caption); color: var(--text-secondary); display: inline-flex; gap: var(--space-2); align-items: center; }
  .busy .ds-spin { width: 16px; height: 16px; border-width: 2px; border-top-color: var(--primary); border-color: color-mix(in srgb, var(--text-primary) 20%, transparent); border-top-color: var(--primary); }
  .add { padding: var(--space-2) var(--space-4) var(--space-4); border-bottom: 1px solid var(--divider); }
  .add .row { display: flex; gap: var(--space-2); max-width: 420px; }
  .add .ds-field { flex: 1; }
</style>
</head>
<body class="ds">
<div class="wrap">
  <section class="ds-panel" aria-labelledby="ch">
    <h2 id="ch" class="ds-ihead"><i data-i="livetv"></i>Channels</h2>
    <div class="add">
      <label class="ds-field-label" for="login">Add channel</label>
      <div class="row"><span class="ds-field invalid"><input id="login" value="nightjr_tv" aria-invalid="true" spellcheck="false"></span><button class="ds-btn filled"><i data-i="add"></i>Add</button></div>
      <p class="ds-field-error" role="alert"><i data-i="error" class="xs"></i>No Twitch channel by that login.</p>
    </div>
    <ul class="ds-list">
      <li><span class="ds-avatar a1 live">N</span><span class="who"><b>Nightjar</b><span>nightjar_tv</span></span><span class="ds-status rec">Rec</span><span class="ds-status saved">Push</span><span class="ds-grow"></span><button class="ds-btn text default">Stop recording</button><button class="ds-btn text default">Remove</button></li>
      <li><span class="ds-avatar a3">C</span><span class="who"><b>Copper Moth</b><span>coppermoth</span></span><span class="ds-status saved"><i data-i="check"></i>Watching</span><span class="ds-status partial"><i data-i="schedule"></i>Polling</span><span class="ds-grow"></span><button class="ds-btn text default">Pause</button><button class="ds-btn text default">Remove</button></li>
      <li><span class="ds-avatar a2">P</span><span class="who"><b>Pixel Wren</b><span>pixelwren</span></span><span class="ds-status saved"><i data-i="pause"></i>Paused</span><span class="ds-status saved">Push</span><span class="ds-grow"></span><button class="ds-btn text">Resume recording</button><button class="ds-btn text default">Remove</button></li>
      <li aria-busy="true"><span class="ds-avatar">S</span><span class="who"><b>Sable Finch</b><span>sablefinch</span></span><span class="ds-status saved"><i data-i="check"></i>Watching</span><span class="ds-grow"></span><span class="busy" role="status"><span class="ds-spin" aria-hidden="true"></span>Removing…</span></li>
    </ul>
  </section>
</div>
<script src="../icons.js"></script>
</body>
</html>
