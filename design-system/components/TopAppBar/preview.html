<!-- @dsCard group="Layout" height=470 width=1100 subtitle="MudAppBar on desktop (signed in, signed out) and Dense below Breakpoint.Md (home, watching)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  .wrap { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); }
  .cap { font: var(--text-caption); color: var(--text-secondary); margin: 0 0 var(--space-1); }
  .ds-appbar { border: 1px solid var(--divider); border-radius: var(--radius-md); }
  .acct { border-radius: var(--radius-full); padding-left: 6px; }
</style>
</head>
<body class="ds">
<div class="wrap">
  <div>
    <p class="cap">Signed in · capture running</p>
    <header class="ds-appbar">
      <button class="ds-ibtn" aria-label="Collapse library"><i data-i="menu"></i></button>
      <a class="ds-wordmark" href="#" aria-label="StreamKeepr home"><span class="ds-logo rec" aria-hidden="true"><i data-i="logo"></i></span><span>Stream<b>Keepr</b></span></a>
      <label class="ds-field ds-search"><i data-i="search" class="sm"></i><input value="speed" aria-label="Search recordings"></label>
      <a class="ds-ibtn" href="#" aria-label="StreamKeepr on GitHub (opens in a new tab)" title="StreamKeepr on GitHub"><i data-i="github"></i></a><a class="ds-ibtn" href="#" aria-label="Twitch (opens in a new tab)" title="Twitch"><i data-i="livetv"></i></a><button class="ds-ibtn" aria-label="Settings"><i data-i="settings"></i></button>
      <button class="ds-acct" aria-label="Twitch account: Pixel Wren" aria-haspopup="menu"><span class="ds-avatar a2">P</span></button>
    </header>
  </div>
  <div>
    <p class="cap">Signed out · nothing recording</p>
    <header class="ds-appbar">
      <button class="ds-ibtn" aria-label="Open library"><i data-i="menu"></i></button>
      <a class="ds-wordmark" href="#" aria-label="StreamKeepr home"><span class="ds-logo" aria-hidden="true"><i data-i="logo"></i></span><span>Stream<b>Keepr</b></span></a>
      <label class="ds-field ds-search"><i data-i="search" class="sm"></i><input placeholder="Search recordings, streamers, categories" aria-label="Search recordings"></label>
      <a class="ds-ibtn" href="#" aria-label="StreamKeepr on GitHub (opens in a new tab)" title="StreamKeepr on GitHub"><i data-i="github"></i></a><a class="ds-ibtn" href="#" aria-label="Twitch (opens in a new tab)" title="Twitch"><i data-i="livetv"></i></a><button class="ds-ibtn" aria-label="Settings"><i data-i="settings"></i></button>
      <a class="ds-btn twitch" href="#"><i data-i="link"></i>Connect with Twitch</a>
    </header>
  </div>
  <div>
    <p class="cap">Below Breakpoint.Md · Dense (48px) · Home and Settings</p>
    <header class="ds-appbar dense" style="max-width:400px">
      <a class="ds-wordmark" href="#" style="margin-left:8px" aria-label="StreamKeepr home"><span class="ds-logo rec" aria-hidden="true"><i data-i="logo"></i></span><span>Stream<b>Keepr</b></span></a>
      <span class="ds-grow"></span>
      <button class="ds-ibtn" aria-label="Search recordings"><i data-i="search"></i></button>
      <a class="ds-ibtn" href="#" aria-label="StreamKeepr on GitHub (opens in a new tab)" title="StreamKeepr on GitHub"><i data-i="github"></i></a><a class="ds-ibtn" href="#" aria-label="Twitch (opens in a new tab)" title="Twitch"><i data-i="livetv"></i></a>
      <button class="ds-acct" aria-label="Twitch account: Pixel Wren" aria-haspopup="menu"><span class="ds-avatar a2">P</span></button>
    </header>
  </div>
  <div>
    <p class="cap">Below Breakpoint.Md · Dense · watching a recording</p>
    <header class="ds-appbar dense" style="max-width:400px">
      <button class="ds-ibtn" aria-label="Back to Home"><i data-i="arrowback"></i></button>
      <span class="ptitle ds-grow">Late-night speedrun practice</span>
      <button class="ds-ibtn" aria-label="Search recordings"><i data-i="search"></i></button>
    </header>
  </div>
</div>
<script src="../icons.js"></script>
</body>
</html>
